name: Weekly data

# 1. Imports artifacts from Wikidata into Neon (and fills in photos for curated artifacts).
# 2. Exports the map's places and artifacts to static JSON in frontend/public/data/.
# 3. Commits those files if they changed. Cloudflare sees the commit and rebuilds the site, so
#    visitors read the map's data from Cloudflare and never wait for Render or Neon.
#
# Free on GitHub Actions. Secret: NEON_DATABASE_URL (the same one the Daily jobs use).
# It does not run migrations: run `alembic upgrade head` against Neon yourself after adding one.
on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC, an hour after the Daily jobs
  workflow_dispatch:        # "Run workflow" button on the Actions tab

concurrency:
  group: weekly-data
  cancel-in-progress: false

permissions:
  contents: write   # to commit the exported files

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the backend
        run: pip install .

      - name: Check the database is set up
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error::Add the NEON_DATABASE_URL secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          current=$(alembic current 2>/dev/null | awk '{print $1}')
          head=$(alembic heads | awk '{print $1}')
          if [ "$current" != "$head" ]; then
            echo "::error::Neon is at migration '$current' but the code expects '$head'. Run 'alembic upgrade head' against Neon."
            exit 1
          fi

      - name: Import artifacts from Wikidata
        # If Wikidata is down, still export, so place changes reach the site.
        continue-on-error: true
        run: python -m scripts.import_wikidata_artifacts

      - name: Export the map's data to static files
        run: python -m scripts.export_static_data

      - name: Commit the files if they changed
        working-directory: .
        run: |
          git add frontend/public/data
          if git diff --cached --quiet; then
            echo "No data changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update map data (weekly export)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
