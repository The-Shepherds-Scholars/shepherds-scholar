name: Daily jobs

# 1. Fetches today's Mass readings (plus the week ahead) into Neon.
# 2. Refreshes the API.Bible passage cache (skipped until API_BIBLE_KEY is set).
# Free on GitHub Actions. Secrets: NEON_DATABASE_URL (required), API_BIBLE_KEY (optional).
on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 5 a.m. New York in winter, 6 a.m. in summer
  workflow_dispatch:        # "Run workflow" button on the Actions tab

concurrency:
  group: daily-readings
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the backend and a headless browser
        run: |
          pip install . "catholic-mass-readings[browser]"
          python -m playwright install --with-deps chromium

      - name: Fetch readings
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error::Add the NEON_DATABASE_URL secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          python -m app.jobs.fetch_daily_readings

      - name: Refresh API.Bible passage cache
        if: ${{ always() }}   # run even if the readings step failed
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          API_BIBLE_KEY: ${{ secrets.API_BIBLE_KEY }}
        run: |
          if [ -z "$API_BIBLE_KEY" ]; then
            echo "::notice::Skipped: add the API_BIBLE_KEY secret to refresh the passage cache."
            exit 0
          fi
          python -m app.jobs.refresh_passage_cache
