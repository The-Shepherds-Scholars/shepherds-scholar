name: Daily readings

# Fetches today's Mass readings (plus the week ahead) into Neon.
# Free on GitHub Actions. Needs the repository secret NEON_DATABASE_URL.
on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = 5 a.m. New York in winter, 6 a.m. in summer
  workflow_dispatch:        # "Run workflow" button on the Actions tab

concurrency:
  group: daily-readings
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install the backend and a headless browser
        run: |
          pip install . "catholic-mass-readings[browser]"
          python -m playwright install --with-deps chromium

      - name: Fetch readings
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$NEON_DATABASE_URL" ]; then
            echo "::error::Add the NEON_DATABASE_URL secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          python -m app.jobs.fetch_daily_readings
